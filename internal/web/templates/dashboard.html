<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiteFaaS - Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>LiteFaaS Dashboard</h1>
            <button id="newFunctionBtn" class="btn btn-primary">Nouvelle Fonction</button>
        </header>

        <main>
            <div class="functions-list">
                <h2>Fonctions</h2>
                <div id="functionsContainer">
                    <div class="loading">Chargement...</div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal pour créer/éditer une fonction -->
    <div id="functionModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modalTitle">Nouvelle Fonction</h2>
            <form id="functionForm">
                <div class="form-group">
                    <label for="functionName">Nom:</label>
                    <input type="text" id="functionName" name="name" required>
                </div>
                <div class="form-group">
                    <label for="functionLanguage">Langage:</label>
                    <select id="functionLanguage" name="language" required>
                        <option value="python">Python</option>
                        <option value="nodejs">Node.js</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="functionCode">Code:</label>
                    <textarea id="functionCode" name="code" rows="10" required></textarea>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Sauvegarder</button>
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Annuler</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
