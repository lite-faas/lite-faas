name: Build and Release

on:
    push:
        tags:
            - "v*"
        branches:
            - "dev"
    workflow_dispatch:

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v4
              with:
                  go-version: "1.21"

            - name: Download dependencies
              run: go mod download

            - name: Run tests
              run: go test ./...

            - name: Run vet
              run: go vet ./...

    build:
        needs: test
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [ubuntu-latest, macos-latest]
                goarch: [amd64, arm64]
                exclude:
                    - os: macos-latest
                      goarch: arm64
                      # Exclure arm64 sur macOS car pas supporté dans ce workflow

        steps:
            - uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v4
              with:
                  go-version: "1.21"

            - name: Download dependencies
              run: go mod download

            - name: Build
              env:
                  GOOS: ${{ matrix.os == 'macos-latest' && 'darwin' || 'linux' }}
                  GOARCH: ${{ matrix.goarch }}
                  CGO_ENABLED: 1
              run: |
                  go build -ldflags="-s -w" -o litefaas-${{ matrix.os == 'macos-latest' && 'darwin' || 'linux' }}-${{ matrix.goarch }} cmd/litefaas/main.go

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: litefaas-${{ matrix.os == 'macos-latest' && 'darwin' || 'linux' }}-${{ matrix.goarch }}
                  path: litefaas-${{ matrix.os == 'macos-latest' && 'darwin' || 'linux' }}-${{ matrix.goarch }}

    release:
        needs: build
        runs-on: ubuntu-latest
        if: startsWith(github.ref, 'refs/tags/')

        steps:
            - uses: actions/checkout@v4

            - name: Download all artifacts
              uses: actions/download-artifact@v4

            - name: Create Release
              id: create_release
              uses: actions/create-release@v1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  tag_name: ${{ github.ref }}
                  release_name: Release ${{ github.ref }}
                  draft: false
                  prerelease: false

            - name: Upload Release Assets
              uses: actions/upload-release-asset@v1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  upload_url: ${{ steps.create_release.outputs.upload_url }}
                  asset_path: ./litefaas-linux-amd64/litefaas-linux-amd64
                  asset_name: litefaas-linux-amd64
                  asset_content_type: application/octet-stream

            - name: Upload Release Assets
              uses: actions/upload-release-asset@v1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  upload_url: ${{ steps.create_release.outputs.upload_url }}
                  asset_path: ./litefaas-linux-arm64/litefaas-linux-arm64
                  asset_name: litefaas-linux-arm64
                  asset_content_type: application/octet-stream

            - name: Upload Release Assets
              uses: actions/upload-release-asset@v1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  upload_url: ${{ steps.create_release.outputs.upload_url }}
                  asset_path: ./litefaas-darwin-amd64/litefaas-darwin-amd64
                  asset_name: litefaas-darwin-amd64
                  asset_content_type: application/octet-stream

    upload-dev:
        needs: build
        runs-on: ubuntu-latest
        if: github.ref == 'refs/heads/dev'

        steps:
            - uses: actions/checkout@v4

            - name: Download all artifacts
              uses: actions/download-artifact@v4

            - name: Upload Dev Builds
              uses: actions/upload-artifact@v4
              with:
                  name: dev-builds-${{ github.sha }}
                  path: |
                      litefaas-linux-amd64/
                      litefaas-linux-arm64/
                      litefaas-darwin-amd64/
                  retention-days: 30
